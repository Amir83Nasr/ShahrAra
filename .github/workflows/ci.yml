# ────────────────────────────────────────────────────────────────
# CI — ShahrAra
# ────────────────────────────────────────────────────────────────
# Runs on push to main and pull requests.
# Checks: backend lint + tests, frontend lint + typecheck + build.
# ────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shahr_ara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shahr_ara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Backend ────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        run: cd backend && uv sync

      - name: Run backend lint
        run: cd backend && uv run ruff check .

      - name: Run backend tests
        run: cd backend && uv run pytest tests/

      # ── Frontend ───────────────────────────────────────
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.2.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Run frontend lint + typecheck
        run: cd frontend && pnpm run lint && pnpm exec tsc --noEmit

      - name: Build frontend
        run: cd frontend && pnpm run build
