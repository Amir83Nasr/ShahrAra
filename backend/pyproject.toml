[project]
name = "shahr-ara-backend"
version = "0.1.0"
description = "ShahrAra - Municipal Engagement System Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.138.0",
    "uvicorn==0.49.0",
    "sqlalchemy==2.0.50",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.2",
    "python-jose[cryptography]==3.5.0",
    "psycopg[binary]>=3.3.5",
    "alembic>=1.19.2",
    "bcrypt>=5.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest==9.0.2",
    "ruff==0.15.16",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
ignore = ["E501", "N802", "N803", "N815"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short -q"
