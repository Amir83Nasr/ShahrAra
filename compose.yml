# ─── SERVICES ─────────────────────────────────────────────
services:
  db:
    image: postgres:18
    container_name: shahr-ara-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-shahr_ara}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - shahr_ara_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shahr_ara}"]
      interval: 5s
      timeout: 5s
      retries: 5

# ─── VOLUMES ──────────────────────────────────────────────
volumes:
  shahr_ara_data:
