# ─── SERVICES ─────────────────────────────────────────────
services:
  db:
    image: postgres:18
    container_name: shahr-ara-db
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-shahr_ara}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - shahr_ara_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shahr_ara}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shahr-ara-backend
    restart: unless-stopped
    # Dev: local docker DB. Production: set DATABASE_URL (Neon) in .env —
    # the db service and depends_on are dev-only.
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/shahr_ara}
      - DATABASE_URL_UNPOOLED=${DATABASE_URL_UNPOOLED:-}
      - JWT_SECRET=${JWT_SECRET:-shahr-ara-dev-secret-change-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRATION_MINUTES=${JWT_EXPIRATION_MINUTES:-1440}
      - ADMIN_PHONE=${ADMIN_PHONE:-09306853363}
      - ADMIN_NATIONAL_ID=${ADMIN_NATIONAL_ID:-0372660673}
      - ADMIN_FIRST_NAME=${ADMIN_FIRST_NAME:-امیرحسین}
      - ADMIN_LAST_NAME=${ADMIN_LAST_NAME:-نصراللهی}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shahr-ara-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

# ─── VOLUMES ──────────────────────────────────────────────
volumes:
  shahr_ara_data:
